services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parcelview}
      POSTGRES_USER: ${POSTGRES_USER:-parcelview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcelview}
    ports:
      - "5432:5432"
    volumes:
      - parcelview_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  parcelview_dev_data: